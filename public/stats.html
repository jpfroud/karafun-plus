<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistiques de soirée</title>
<link rel="stylesheet" href="/app.css">
<style>
/* Page réservée au bar. Jetons de app.css, plus un thème clair choisi
   (palette des graphiques validée sur chaque surface). */
:root {
  --chart-surface: var(--surface);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --mark-muted: #4a4566; --grid: #2a2648; --axis: #3d3866; --ref: #f4f1ff; --gap-band: rgba(169,163,199,.14);
}
@media (prefers-color-scheme: light) {
  :root:where(:not([data-theme="dark"])) {
    color-scheme: light;
    --bg: #f5f4fa; --surface: #fcfcfb; --surface-2: #eeecf6; --line: #dedbea; --text: #17142a; --muted: #5d5875;
    --accent: #c92a7c; --accent-2: #5b3fe0;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --mark-muted: #cbc8d8; --grid: #e8e6f0; --axis: #c3c0d0; --ref: #17142a; --gap-band: rgba(93,88,117,.12);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f4fa; --surface: #fcfcfb; --surface-2: #eeecf6; --line: #dedbea; --text: #17142a; --muted: #5d5875;
  --accent: #c92a7c; --accent-2: #5b3fe0;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --mark-muted: #cbc8d8; --grid: #e8e6f0; --axis: #c3c0d0; --ref: #17142a; --gap-band: rgba(93,88,117,.12);
}
:root[data-theme="dark"] { color-scheme: dark; }
body.stats-page { background: var(--bg); color: var(--text); padding: 16px; max-width: 1400px; margin: 0 auto; }
.st-top { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; margin-bottom: 12px; }
.st-top h1 { margin: 0; font-size: clamp(22px, 4vw, 30px); }
.eyebrow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-2); margin-bottom: 3px; }
.st-filters { position: sticky; top: 0; z-index: 4; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 0; background: var(--bg); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.st-filters label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); }
.st-filters select { width: auto; min-height: 38px; padding: 6px 10px; max-width: 62vw; }
.st-filters .st-spacer { flex: 1; }
.st-check input { width: 18px; height: 18px; }
main.st-main { transition: opacity .2s; }
main.st-main.loading { opacity: .6; }
.st-insights { display: grid; gap: 8px; margin-bottom: 14px; }
.st-insight { display: flex; gap: 10px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.st-insight .st-icon { font-weight: 800; flex: none; width: 1.2em; text-align: center; color: var(--muted); }
.st-insight.warn .st-icon, .st-insight.good .st-icon { color: var(--text); }
.st-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.st-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.st-kpi .st-label { font-size: 13px; color: var(--muted); }
.st-kpi .st-value { font-size: 28px; font-weight: 650; line-height: 1.15; margin-top: 2px; }
.st-kpi .st-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.st-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 14px; }
.st-card { background: var(--chart-surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 0; min-width: 0; }
.st-card.wide { grid-column: 1 / -1; }
.st-card + .st-card { margin-top: 0; }
.st-head { display: flex; justify-content: space-between; gap: 10px; align-items: start; margin-bottom: 8px; }
.st-head h2 { margin: 0; font-size: 17px; }
.st-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
.st-head .btn { min-height: 32px; padding: 4px 10px; font-size: 13px; flex: none; }
.st-plot { width: 100%; overflow: hidden; }
.st-plot svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.st-plot text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.st-plot text.st-strong { fill: var(--text); font-weight: 600; }
.st-plot .st-hit { fill: transparent; cursor: pointer; }
.st-plot .st-mark:hover, .st-plot .st-mark:focus { filter: brightness(1.15); outline: none; }
.st-plot .st-row:hover .st-hitrow, .st-plot .st-hitrow:focus { fill: var(--gap-band); outline: none; }
.st-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin-top: 6px; }
.st-legend span { display: inline-flex; align-items: center; gap: 6px; }
.st-key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.st-key.line { height: 2px; width: 16px; border-radius: 1px; }
.st-key.dot { border-radius: 50%; width: 10px; height: 10px; }
.st-key.tick { width: 2px; height: 14px; border-radius: 1px; }
.st-table-wrap { overflow-x: auto; }
table.st-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.st-table th, .st-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.st-table td.num, .st-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
.st-table th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--chart-surface); }
.st-table th button { all: unset; cursor: pointer; }
.st-table tr.focus td { background: var(--surface-2); font-weight: 600; }
.st-empty { color: var(--muted); padding: 16px 0; text-align: center; }
.st-tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface-2); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.25); max-width: 300px; }
.st-tip .st-tip-title { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.st-tip .st-tip-row { display: flex; gap: 8px; align-items: baseline; }
.st-tip .st-tip-row strong { font-variant-numeric: tabular-nums; }
.st-tip .st-tip-row .st-key { flex: none; align-self: center; }
.st-mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.st-mini div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.st-mini b { display: block; font-size: 20px; font-weight: 650; }
.st-mini small { color: var(--muted); }
.st-list { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; }
.st-list li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
.st-list time { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.st-error { background: var(--surface); border: 1px solid var(--bad); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
.st-foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
.st-foot dt { font-weight: 700; color: var(--text); margin-top: 6px; }
.st-foot dd { margin: 0; }
@media (max-width: 640px) {
  body.stats-page { padding: 10px; }
  .st-kpi .st-value { font-size: 22px; }
  .st-filters { position: static; }
  .st-filters .st-spacer { display: none; }
}
@media print { .st-filters { position: static; } .st-head .btn { display: none; } }
</style>
</head>
<body class="stats-page">
<header class="st-top">
  <div><div class="eyebrow">Réservé au bar</div><h1>Statistiques de la soirée</h1><p id="eveningLine" class="muted small">Chargement…</p></div>
  <a class="btn small" id="backLink" href="/staff">← Page du bar</a>
</header>
<div class="st-filters" role="group" aria-label="Filtres">
  <label for="eveningSelect">Soirée <select id="eveningSelect"></select></label>
  <label for="focusSelect">Repère <select id="focusSelect"><option value="">Toute la salle</option></select></label>
  <span id="livePill" class="pill" hidden>En direct</span>
  <span class="st-spacer"></span>
  <label class="st-check" for="exportNames"><input type="checkbox" id="exportNames"> inclure les prénoms</label>
  <button class="btn small" id="downloadBtn" title="Fichier JSON pour analyser la soirée (prénoms remplacés par S01, S02… sauf si la case est cochée)">Télécharger</button>
  <label for="themeSelect">Thème <select id="themeSelect"><option value="">Auto</option><option value="light">Clair</option><option value="dark">Sombre</option></select></label>
</div>
<div id="errorBox" class="st-error" role="alert" hidden></div>
<main class="st-main" id="main">
  <section id="insights" class="st-insights" aria-label="Repères automatiques"></section>
  <section id="kpis" class="st-kpis" aria-label="Chiffres clés"></section>
  <section id="focusCard" class="st-card wide" hidden></section>
  <div class="st-grid" id="charts"></div>
  <dl class="st-foot" id="definitions"></dl>
</main>
<div id="tooltip" class="st-tip" role="tooltip" hidden></div>
<script>
'use strict';
const KEY = new URLSearchParams(location.search).get('key') || '';
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const REFRESH_MS = 15000;
const KIND = { solo: ['Solo', 'var(--s1)'], duo: ['Duo', 'var(--s2)'], battle: ['Battle', 'var(--s3)'], native: ['Hors file', 'var(--s4)'] };
const state = { data: null, listError: null, loadError: null, evening: new URLSearchParams(location.search).get('evening') || 'current', focus: '', tables: {}, sort: { key: 'turns', dir: -1 }, timer: null,
  tableViews: new Set() }; // cartes affichées en tableau, gardées aux rafraîchissements

// ------------------------------------------------------------------ formats
const fmtNum = (v, d = 1) => v == null || !Number.isFinite(v) ? '—' : Number(v).toLocaleString('fr-FR', { maximumFractionDigits: d });
const hhmm = t => t == null ? '—' : new Date(t).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
const dayLabel = t => new Date(t).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
function dur(sec) {
  if (sec == null || !Number.isFinite(sec)) return '—';
  const s = Math.max(0, Math.round(sec));
  if (s < 90) return `${s} s`;
  const m = Math.round(s / 60);
  return m < 90 ? `${m} min` : `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}
const pct = v => v == null ? '—' : `${fmtNum(100 * v, 0)} %`;
const nameOf = id => state.data?.names.people[id] || 'Inconnu';
const tableName = id => id == null ? '—' : state.data?.names.tables[id] || (/^\d+$/.test(String(id)) ? `Table ${id}` : String(id));
const singerById = id => state.data?.stats.singers.find(s => s.id === id);

// ------------------------------------------------------------------ DOM
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat()) if (child != null) el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
  return el;
}
function s(tag, attrs = {}, parent = null) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v != null) el.setAttribute(k, String(v));
  if (parent) parent.appendChild(el);
  return el;
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

// ------------------------------------------------------------------ infobulle
const tip = $('tooltip');
function showTip(event, title, rows) {
  clear(tip);
  if (title) tip.appendChild(h('div', { class: 'st-tip-title', text: title }));
  for (const [value, label, color, shape = 'line'] of rows) {
    tip.appendChild(h('div', { class: 'st-tip-row' }, color ? h('span', { class: `st-key ${shape}`, style: `background:${color}` }) : null,
      h('strong', { text: value }), h('span', { text: label || '' })));
  }
  tip.hidden = false;
  const x = event.clientX ?? 0, y = event.clientY ?? 0;
  const box = tip.getBoundingClientRect ? tip.getBoundingClientRect() : { width: 200, height: 60 };
  const vw = window.innerWidth || 800;
  tip.style.left = `${Math.max(8, Math.min(vw - box.width - 8, x + 14))}px`;
  tip.style.top = `${Math.max(8, y - box.height - 12)}px`;
}
function hideTip() { tip.hidden = true; }
// Infobulle au survol, au toucher et au clavier sur une marque.
function bindTip(el, content) {
  const show = event => { const [title, rows] = content(); showTip(event, title, rows); };
  el.addEventListener('pointerenter', show);
  el.addEventListener('pointermove', show);
  el.addEventListener('pointerleave', hideTip);
  el.addEventListener('focus', event => {
    const r = el.getBoundingClientRect ? el.getBoundingClientRect() : { left: 0, top: 0 };
    show({ clientX: r.left, clientY: r.top });
  });
  el.addEventListener('blur', hideTip);
  el.setAttribute('tabindex', '0');
  return el;
}

// ------------------------------------------------------------------ échelles
function niceStep(max, count = 5) {
  if (!(max > 0)) return 1;
  const raw = max / count, mag = 10 ** Math.floor(Math.log10(raw));
  return [1, 2, 5, 10].map(f => f * mag).find(step => step >= raw);
}
function niceTicks(max, count = 5) {
  const step = niceStep(max, count);
  const top = Math.max(step, Math.ceil(max / step) * step);
  const out = [];
  for (let v = 0; v <= top + step / 2; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}
const linear = (d0, d1, r0, r1) => v => d1 === d0 ? r0 : r0 + (v - d0) * (r1 - r0) / (d1 - d0);
function timeTicks(t0, t1) {
  const span = t1 - t0;
  const step = span <= 3600000 ? 900000 : span <= 3 * 3600000 ? 1800000 : 3600000;
  const first = new Date(t0); first.setSeconds(0, 0);
  first.setMinutes(Math.ceil(first.getMinutes() / (step / 60000)) * (step / 60000));
  const out = [];
  for (let t = first.getTime(); t <= t1; t += step) out.push(t);
  return out;
}
// Barre arrondie du côté de la valeur, carrée sur la ligne de base.
function hbarPath(x0, y, w, hgt, r = 4) {
  const rr = Math.max(0, Math.min(r, w / 2, hgt / 2));
  return `M${x0},${y}H${x0 + w - rr}Q${x0 + w},${y} ${x0 + w},${y + rr}V${y + hgt - rr}Q${x0 + w},${y + hgt} ${x0 + w - rr},${y + hgt}H${x0}Z`;
}
function vbarPath(x, base, w, hgt, r = 4) {
  const rr = Math.max(0, Math.min(r, w / 2, hgt / 2));
  return `M${x},${base}V${base - hgt + rr}Q${x},${base - hgt} ${x + rr},${base - hgt}H${x + w - rr}Q${x + w},${base - hgt} ${x + w},${base - hgt + rr}V${base}Z`;
}
const plotWidth = el => Math.max(320, Math.min(1400, el.clientWidth || 720));

// Repère (personne ou table) : les autres marques passent en gris.
function focusIds() {
  const f = state.focus;
  if (!f || !state.data) return null;
  if (f.startsWith('p:')) return new Set([f.slice(2)]);
  const tableId = f.slice(2);
  return new Set(state.data.stats.singers.filter(x => String(x.tableId) === tableId).map(x => x.id));
}
const inFocus = ids => { const set = focusIds(); return !set || ids.some(id => set.has(id)); };

// ------------------------------------------------------------------ cartes
// Chaque graphique a sa vue tableau (accessibilité, valeurs sans survol).
function card({ id, title, subtitle, wide = false, draw, table, legend = null }) {
  const plot = h('div', { class: 'st-plot', id: `${id}Plot` });
  const tableWrap = h('div', { class: 'st-table-wrap', hidden: true });
  const toggle = h('button', { class: 'btn small ghost', type: 'button', 'aria-pressed': 'false', text: 'Tableau' });
  const showView = showTable => {
    tableWrap.hidden = !showTable;
    plot.hidden = showTable;
    if (legendEl) legendEl.hidden = showTable;
    toggle.textContent = showTable ? 'Graphique' : 'Tableau';
    toggle.setAttribute('aria-pressed', String(showTable));
    if (showTable) state.tableViews.add(id); else state.tableViews.delete(id);
  };
  toggle.addEventListener('click', () => showView(tableWrap.hidden));
  const legendEl = legend ? h('div', { class: 'st-legend' }, legend.map(([label, color, shape]) =>
    h('span', {}, h('span', { class: `st-key ${shape || ''}`, style: `background:${color}` }), label))) : null;
  const el = h('figure', { class: `st-card${wide ? ' wide' : ''}`, id },
    h('div', { class: 'st-head' }, h('div', {}, h('h2', { text: title }), subtitle ? h('p', { text: subtitle }) : null), toggle),
    plot, legendEl, tableWrap);
  $('charts').appendChild(el);
  const [head, rows] = table();
  tableWrap.appendChild(dataTable(head, rows));
  if (state.tableViews.has(id)) showView(true);
  if (!rows.length) { plot.appendChild(h('p', { class: 'st-empty', text: 'Pas encore de données.' })); return el; }
  draw(plot);
  return el;
}

function dataTable(head, rows, { focusOf = null, sortable = null } = {}) {
  const thead = h('thead', {}, h('tr', {}, head.map(([label, num, key], index) => {
    const th = h('th', { class: num ? 'num' : null, scope: 'col' });
    if (sortable && key) {
      const mark = state.sort.key === key ? (state.sort.dir < 0 ? ' ↓' : ' ↑') : '';
      th.appendChild(h('button', { type: 'button', text: label + mark, onclick: () => sortable(key) }));
    } else th.textContent = label;
    return th;
  })));
  const tbody = h('tbody', {}, rows.map(row => h('tr', { class: focusOf && focusOf(row) ? 'focus' : null },
    row.cells.map((value, index) => h('td', { class: head[index][1] ? 'num' : null, text: value == null ? '—' : String(value) })))));
  return h('table', { class: 'st-table' }, thead, tbody);
}

function axisX(svg, ticks, x, y0, y1, label) {
  for (const t of ticks) {
    s('line', { x1: x(t), x2: x(t), y1: y0, y2: y1, stroke: 'var(--grid)', 'stroke-width': 1 }, svg);
    s('text', { x: x(t), y: y1 + 14, 'text-anchor': 'middle' }, svg).textContent = label(t);
  }
}

// ------------------------------------------------------------------ graphiques
function drawTimeline(plot) {
  const st = state.data.stats, tl = st.timeline;
  const W = plotWidth(plot), left = Math.min(150, W * 0.28), right = 12, top = 18, rowH = 16, laneH = 22;
  const stages = tl.stages;
  const singers = [];
  for (const stage of stages) for (const id of stage.ids) if (!singers.includes(id)) singers.push(id);
  const H = top + laneH + 8 + singers.length * rowH + 28;
  const t0 = tl.start, t1 = Math.max(tl.end, ...stages.map(x => x.end), t0 + 60000);
  const x = linear(t0, t1, left, W - right);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Déroulé de la soirée : qui a chanté quand' }, plot);
  axisX(svg, timeTicks(t0, t1), x, top - 6, H - 22, hhmm);
  // Temps morts (un titre attendait) sous la ligne « Scène ».
  for (const gap of tl.gaps.filter(g => g.dead)) {
    const band = s('rect', { x: x(gap.start), y: top, width: Math.max(1, x(gap.end) - x(gap.start)), height: laneH, fill: 'var(--gap-band)' }, svg);
    bindTip(band, () => [`${hhmm(gap.start)} – ${hhmm(gap.end)}`, [[dur(gap.sec), `temps mort : ${gap.label}`]]]);
  }
  s('text', { x: left - 8, y: top + laneH / 2 + 4, 'text-anchor': 'end', class: 'st-strong' }, svg).textContent = 'Scène';
  singers.forEach((id, i) => {
    const t = s('text', { x: left - 8, y: top + laneH + 8 + i * rowH + rowH / 2 + 4, 'text-anchor': 'end' }, svg);
    t.textContent = nameOf(id).slice(0, 18);
  });
  const color = stage => !inFocus(stage.ids) ? 'var(--mark-muted)' : KIND[stage.kind]?.[1] || 'var(--s4)';
  const stageTip = stage => () => [`${hhmm(stage.start)} – ${stage.ongoing ? 'en cours' : hhmm(stage.end)}`, [
    [stage.title || 'Titre', stage.ids.length ? stage.ids.map(nameOf).join(' & ') : KIND[stage.kind]?.[0], KIND[stage.kind]?.[1]],
    ...(stage.waitSec != null ? [[dur(stage.waitSec), 'd’attente']] : []),
    [dur(stage.playedSec), stage.improvised ? 'sur scène · duo noté par le bar' : 'sur scène']]];
  for (const stage of stages) {
    const x0 = x(stage.start), w = Math.max(2, x(stage.end) - x0 - 2);
    const mark = s('rect', { x: x0, y: top + 2, width: w, height: laneH - 4, rx: 3, fill: color(stage), class: 'st-mark' }, svg);
    bindTip(mark, stageTip(stage));
    stage.ids.forEach((id, k) => {
      const row = singers.indexOf(id);
      const m = s('rect', { x: x0, y: top + laneH + 8 + row * rowH + 3, width: w, height: rowH - 6, rx: 3,
        fill: !inFocus([id]) ? 'var(--mark-muted)' : k === 0 ? KIND[stage.kind]?.[1] || 'var(--s1)' : 'var(--s2)', class: 'st-mark' }, svg);
      bindTip(m, stageTip(stage));
    });
  }
  // Repère vertical : l'heure et ce qui passait à cet instant.
  // Sous le curseur, le repère ne doit pas cacher la barre survolée (son info-bulle).
  const cross = s('line', { y1: top - 6, y2: H - 22, stroke: 'var(--ref)', 'stroke-width': 1, visibility: 'hidden', 'pointer-events': 'none' }, svg);
  svg.addEventListener('pointermove', event => {
    const box = svg.getBoundingClientRect ? svg.getBoundingClientRect() : { left: 0, width: W };
    const px = ((event.clientX - box.left) / (box.width || W)) * W;
    if (px < left) { cross.setAttribute('visibility', 'hidden'); return; }
    const t = t0 + (px - left) * (t1 - t0) / (W - right - left);
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    if (event.target !== svg) return;
    const playing = stages.find(stage => stage.start <= t && t < stage.end);
    const sample = [...tl.queue].reverse().find(q => q.t <= t);
    showTip(event, hhmm(t), [
      [playing ? playing.title : 'Rien', playing ? (playing.ids.map(nameOf).join(' & ') || KIND[playing.kind]?.[0]) : 'sur scène', playing ? KIND[playing.kind]?.[1] : null],
      ...(sample ? [[fmtNum(sample.ready, 0), 'titres prêts dans la file']] : [])]);
  });
  svg.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(); });
}

function drawWaits(plot, rows) {
  const W = plotWidth(plot), left = Math.min(140, W * 0.3), right = 40, top = 8, rowH = 26;
  const H = top + rows.length * rowH + 26;
  const max = Math.max(...rows.map(r => r.waits.maxSec), 60) / 60;
  const ticks = niceTicks(max, 5);
  const x = linear(0, ticks.at(-1), left, W - right);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Attente avant de chanter, par chanteur' }, plot);
  axisX(svg, ticks, x, top, H - 22, v => `${fmtNum(v, 0)} min`);
  const avg = state.data.stats.global.waitAvgSec;
  if (avg != null) {
    s('line', { x1: x(avg / 60), x2: x(avg / 60), y1: top, y2: H - 22, stroke: 'var(--ref)', 'stroke-width': 1 }, svg);
    s('text', { x: x(avg / 60) + 4, y: top + 9, class: 'st-strong' }, svg).textContent = `moyenne ${dur(avg)}`;
  }
  rows.forEach((r, i) => {
    const y = top + i * rowH + rowH / 2;
    const g = s('g', { class: 'st-row' }, svg);
    const hit = s('rect', { x: 0, y: y - rowH / 2, width: W, height: rowH, class: 'st-hitrow', fill: 'transparent' }, g);
    s('text', { x: left - 8, y: y + 4, 'text-anchor': 'end' }, g).textContent = nameOf(r.id).slice(0, 18);
    const tint = inFocus([r.id]) ? 'var(--s1)' : 'var(--mark-muted)';
    s('line', { x1: x(r.waits.minSec / 60), x2: x(r.waits.maxSec / 60), y1: y, y2: y, stroke: inFocus([r.id]) ? 'var(--muted)' : 'var(--mark-muted)', 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
    s('circle', { cx: x(r.waits.avgSec / 60), cy: y, r: 5, fill: tint, stroke: 'var(--chart-surface)', 'stroke-width': 2 }, g);
    bindTip(hit, () => [`${nameOf(r.id)} · ${tableName(r.tableId)}`, [[dur(r.waits.avgSec), `en moyenne (${r.waits.n} passage${r.waits.n > 1 ? 's' : ''})`, 'var(--s1)', 'dot'],
      [`${dur(r.waits.minSec)} – ${dur(r.waits.maxSec)}`, 'de la plus courte à la plus longue']]]);
  });
}

function drawRates(plot, rows) {

    bindTip(hit, () => [`${nameOf(r.id)} · ${tableName(r.tableId)}`, [[fmtNum(r.turnsPerHour, 2), 'passages par heure de présence', 'var(--s1)', ''],

      [`${r.turns} / ${fmtNum(r.expectedTurns, 1)}`, `passages réels / attendus · présence ${dur(r.presenceSec)}${r.bonus ? ` · bonus ${r.bonus > 0 ? '+' : ''}${r.bonus}` : ''}`]]]);
  });
}

function drawQueue(plot) {
  const samples = state.data.stats.timeline.queue;
  const W = plotWidth(plot), left = 34, right = 12, top = 10, H = 220, bottom = 24;
  const t0 = samples[0].t, t1 = Math.max(samples.at(-1).t, t0 + 60000);
  const max = Math.max(...samples.map(q => Math.max(q.ready || 0, q.present || 0)), 2);
  const ticks = niceTicks(max, 4);
  const x = linear(t0, t1, left, W - right), y = linear(0, ticks.at(-1), H - bottom, top);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Titres prêts et personnes présentes au fil de la soirée' }, plot);
  for (const v of ticks) {
    s('line', { x1: left, x2: W - right, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 }, svg);
    s('text', { x: left - 6, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = fmtNum(v, 0);
  }
  for (const t of timeTicks(t0, t1)) s('text', { x: x(t), y: H - 6, 'text-anchor': 'middle' }, svg).textContent = hhmm(t);
  const series = [['present', 'Personnes présentes', 'var(--s2)'], ['ready', 'Titres prêts', 'var(--s1)']];
  for (const [key, , color] of series) {
    const d = samples.map((q, i) => `${i ? 'L' : 'M'}${x(q.t).toFixed(1)},${y(q[key] || 0).toFixed(1)}`).join('');
    s('path', { d, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg);
  }
  const last = samples.at(-1);
  s('circle', { cx: x(last.t), cy: y(last.ready || 0), r: 4, fill: 'var(--s1)', stroke: 'var(--chart-surface)', 'stroke-width': 2 }, svg);
  const cross = s('line', { y1: top, y2: H - bottom, stroke: 'var(--ref)', 'stroke-width': 1, visibility: 'hidden', 'pointer-events': 'none' }, svg);
  const overlay = s('rect', { x: left, y: top, width: W - left - right, height: H - top - bottom, fill: 'transparent',
    tabindex: 0, role: 'slider', 'aria-label': 'Relevés de la file : flèches gauche et droite pour parcourir' }, svg);
  // Relevé montré : au survol, au toucher (sans glisser) et au clavier (← →).
  let index = samples.length - 1;
  const showSample = (i, event) => {
    index = Math.max(0, Math.min(samples.length - 1, i));
    const near = samples[index];
    cross.setAttribute('x1', x(near.t)); cross.setAttribute('x2', x(near.t)); cross.setAttribute('visibility', 'visible');
    overlay.setAttribute('aria-valuetext', `${hhmm(near.t)} : ${fmtNum(near.ready, 0)} titres prêts, ${fmtNum(near.present, 0)} personnes présentes`);
    showTip(event, hhmm(near.t), series.map(([key, label, color]) => [fmtNum(near[key], 0), label.toLowerCase(), color]).reverse());
  };
  const nearest = event => {
    const box = svg.getBoundingClientRect ? svg.getBoundingClientRect() : { left: 0, width: W };
    const px = ((event.clientX - box.left) / (box.width || W)) * W;
    const t = t0 + (px - left) * (t1 - t0) / (W - left - right);
    return samples.reduce((best, q, i) => Math.abs(q.t - t) < Math.abs(samples[best].t - t) ? i : best, 0);
  };
  const hide = () => { cross.setAttribute('visibility', 'hidden'); hideTip(); };
  const atSample = () => {
    const box = svg.getBoundingClientRect ? svg.getBoundingClientRect() : { left: 0, top: 0, width: W };
    const scale = (box.width || W) / W;
    return { clientX: box.left + x(samples[index].t) * scale, clientY: box.top + top * scale };
  };
  overlay.addEventListener('pointermove', event => showSample(nearest(event), event));
  overlay.addEventListener('pointerdown', event => showSample(nearest(event), event));
  // Doigt levé : l'info-bulle reste jusqu'au toucher suivant ; la souris qui sort la cache.
  overlay.addEventListener('pointerleave', event => { if (event.pointerType !== 'touch') hide(); });
  overlay.addEventListener('focus', () => showSample(index, atSample()));
  overlay.addEventListener('blur', hide);
  overlay.addEventListener('keydown', event => {
    const step = { ArrowLeft: -1, ArrowRight: 1, Home: -samples.length, End: samples.length }[event.key];
    if (step === undefined) return;
    event.preventDefault();
    showSample(index + step, atSample());
  });
}

// Colonnes simples (une série) ou empilées (plusieurs séries, légende).
function drawColumns(plot, rows, { series, label, valueLabel, aria }) {
  const W = plotWidth(plot), left = 34, right = 10, top = 14, H = 210, bottom = 26;
  const totals = rows.map(r => series.reduce((n, [key]) => n + (r[key] || 0), 0));
  const ticks = niceTicks(Math.max(...totals, 1), 4);
  const y = linear(0, ticks.at(-1), H - bottom, top);
  const band = (W - left - right) / rows.length;
  const barW = Math.min(24, band * 0.7);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': aria }, plot);
  for (const v of ticks) {
    s('line', { x1: left, x2: W - right, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-width': 1 }, svg);
    s('text', { x: left - 6, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = fmtNum(v, 0);
  }
  rows.forEach((r, i) => {
    const cx = left + band * i + band / 2;
    let base = H - bottom;
    const visible = series.filter(([key]) => r[key] > 0);
    // Segments empilés séparés par 2 px de surface ; seul le dernier est arrondi.
    visible.forEach(([key, , color], k) => {
      const hgt = y(0) - y(r[key]);
      const last = k === visible.length - 1;
      s('path', { d: last ? vbarPath(cx - barW / 2, base, barW, hgt) :
        `M${cx - barW / 2},${base}V${base - hgt + 2}H${cx + barW / 2}V${base}Z`, fill: color, class: 'st-mark' }, svg);
      base -= hgt;
    });
    if (totals[i] > 0) s('text', { x: cx, y: base - 4, 'text-anchor': 'middle' }, svg).textContent = fmtNum(totals[i], 0);
    s('text', { x: cx, y: H - 8, 'text-anchor': 'middle' }, svg).textContent = label(r);
    const hit = s('rect', { x: cx - Math.max(12, band / 2), y: top, width: Math.max(24, band), height: H - top - bottom, class: 'st-hit' }, svg);
    bindTip(hit, () => [label(r), series.length > 1 ? series.map(([key, name, color]) => [fmtNum(r[key] || 0, 0), name, color, '']) :
      [[fmtNum(totals[i], 0), valueLabel]]]);
  });
}

// Barres horizontales d'une seule série.
function drawBars(plot, rows, { value, format, label, aria, suffix = '' }) {
  const W = plotWidth(plot), left = Math.min(190, W * 0.4), right = 56, top = 6, rowH = 26, barH = 14;
  const H = top + rows.length * rowH + 22;
  const ticks = niceTicks(Math.max(...rows.map(value), 1), 4);
  const x = linear(0, ticks.at(-1), left, W - right);
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': aria }, plot);
  axisX(svg, ticks, x, top, H - 20, v => `${fmtNum(v, 1)}${suffix}`);
  rows.forEach((r, i) => {
    const y = top + i * rowH + (rowH - barH) / 2;
    const g = s('g', { class: 'st-row' }, svg);
    const hit = s('rect', { x: 0, y: y - (rowH - barH) / 2, width: W, height: rowH, class: 'st-hitrow', fill: 'transparent' }, g);
    s('text', { x: left - 8, y: y + barH - 3, 'text-anchor': 'end' }, g).textContent = label(r).slice(0, 28);
    const w = x(value(r)) - left;
    if (w > 0) s('path', { d: hbarPath(left, y, w, barH), fill: r.muted ? 'var(--mark-muted)' : 'var(--s1)' }, g);
    s('text', { x: left + Math.max(0, w) + 6, y: y + barH - 3 }, g).textContent = format(r);
    bindTip(hit, () => [label(r), [[format(r), aria.toLowerCase()]]]);
  });
}

    draw: plot => drawColumns(plot, histo, { series: [['count', 'Passages', 'var(--s1)']], label: bucketLabel, valueLabel: 'passages', aria: 'Nombre de passages par durée d’attente' }) });
  card({ id: 'chartDead', title: 'Causes des temps morts',
    subtitle: g.deadGapCount ? `${dur(g.deadSec)} au total, ${dur(g.deadAvgSec)} en moyenne entre deux chansons (${g.deadGapCount} intervalles)` : 'Aucun temps mort entre deux chansons.',
    table: () => [[['Cause'], ['Durée', true], ['Part', true]], g.deadCauses.map(c => ({ cells: [c.label, dur(c.sec), pct(g.deadSec ? c.sec / g.deadSec : null)] }))],
    draw: plot => drawBars(plot, g.deadCauses, { value: c => c.sec / 60, format: c => dur(c.sec), label: c => c.label, aria: 'Temps morts par cause', suffix: ' min' }) });
  const hourly = st.timeline.hourly;
  card({ id: 'chartHourly', title: 'Chansons par heure', subtitle: 'Selon l’heure de lancement.', legend: kinds,
    table: () => [[['Heure'], ['Solo', true], ['Duo', true], ['Battle', true], ['Hors file', true]], hourly.map(r => ({ cells: [hhmm(r.start), r.solo, r.duo, r.battle, r.native] }))],
    draw: plot => drawColumns(plot, hourly, { series: Object.entries(KIND).map(([key, [label, color]]) => [key, label, color]), label: r => `${new Date(r.start).getHours()} h`, aria: 'Chansons par heure, par type' }) });
  const tables = st.tables.filter(tb => tb.singers > 0);
  const focus = focusIds();
  card({ id: 'chartTables', title: 'Tables', subtitle: 'Passages par chanteur et par heure de présence.',
    table: () => [[['Table'], ['Chanteurs', true], ['Passages', true], ['Par chanteur·heure', true], ['Attente moy.', true], ['Plus longue', true]],
      tables.map(tb => ({ cells: [tableName(tb.id), tb.singers, tb.turns, fmtNum(tb.turnsPerSingerHour, 2), dur(tb.waits.avgSec), dur(tb.waits.maxSec)] }))],
    draw: plot => {
      const rows = tables.map(tb => ({ ...tb, muted: !!focus && !st.singers.some(x => focus.has(x.id) && String(x.tableId) === tb.id) }));
      drawBars(plot, rows, { value: tb => tb.turnsPerSingerHour || 0, format: tb => fmtNum(tb.turnsPerSingerHour, 2), label: tb => tableName(tb.id), aria: 'Passages par chanteur et par heure' });
      plot.appendChild(h('p', { class: 'small muted', text: 'Attente moyenne par table' }));
      drawBars(plot, rows.filter(tb => tb.waits.n), { value: tb => tb.waits.avgSec / 60, format: tb => dur(tb.waits.avgSec), label: tb => tableName(tb.id), aria: 'Attente moyenne par table', suffix: ' min' });
    } });
  renderSocial();
  renderSingerTable();
}

const bucketLabel = b => b.toMin == null ? `${b.fromMin} min et +` : `${b.fromMin}–${b.toMin} min`;

function renderSocial() {
  const g = state.data.stats.global, d = g.duos, b = g.battle;
  const el = h('figure', { class: 'st-card', id: 'cardSocial' }, h('div', { class: 'st-head' }, h('div', {}, h('h2', { text: 'Duos et Battles' }),
    h('p', { text: 'Invitations, demandes et votes de la soirée.' }))));
  el.appendChild(h('div', { class: 'st-mini' }, ...[
    [g.duoStages, 'duos chantés'], [d.invites, 'invitations'], [d.accepted, 'acceptées'], [d.declined, 'refusées'], [d.inviteExpired, 'sans réponse'],
    [d.joinRequests, 'demandes « Duo ? »'], [d.joinAccepted, 'acceptées'], [d.joinExpired, 'expirées'], [d.improvisedStages, 'notés par le bar'],
    [g.crossTableDuos, 'entre tables'], [b.proposals, 'votes Battle'], [b.votes, 'voix'], [b.launched, 'Battles lancées']]
    .map(([value, label]) => h('div', {}, h('b', { text: String(value ?? 0) }), h('small', { text: label })))));
  const outcomes = { approved: 'acceptée', quorum: 'pas assez de votants', rejected: 'refusée', expired: 'sans vote' };
  const items = state.data.stats.timeline.battles;
  if (items.length) {
    el.appendChild(h('ul', { class: 'st-list' }, items.map(item => h('li', {}, h('time', { text: hhmm(item.t) }),
      h('span', { text: item.kind === 'proposed' ? `Vote proposé (${item.eligible ?? '?'} votants possibles)` :
        item.kind === 'decided' ? `Vote terminé : ${outcomes[item.outcome] || item.outcome} (${item.voters ?? 0} voix)` : `Battle lancée par le bar${item.title ? ` : « ${item.title} »` : ''}` })))));
  }
  $('charts').appendChild(el);
}

function renderSingerTable() {
  const st = state.data.stats;
  const cols = [['Chanteur', false, 'name'], ['Table', false, 'table'], ['Présence', true, 'presenceSec'], ['Passages', true, 'turns'],
    ['Invité', true, 'guestTurns'], ['Par heure', true, 'turnsPerHour'], ['Attendus', true, 'expectedTurns'], ['Attente moy.', true, 'wait'],
    ['Plus longue', true, 'waitMax'], ['1er passage', true, 'firstTurnSec'], ['Pas prêt', true, 'deferrals'], ['Je suis là manqués', true, 'presenceSkips'],
    ['Titres retirés', true, 'removed'], ['Voix Battle', true, 'battleVotes']];
  const value = (row, key) => key === 'name' ? nameOf(row.id).toLocaleLowerCase('fr') : key === 'table' ? tableName(row.tableId) :
    key === 'wait' ? row.waits.avgSec : key === 'waitMax' ? row.waits.maxSec : row[key];
  const rows = [...st.singers].sort((a, b) => {
    const va = value(a, state.sort.key), vb = value(b, state.sort.key);
    if (va == null) return 1; if (vb == null) return -1;
    return (va > vb ? 1 : va < vb ? -1 : 0) * state.sort.dir;
  });
  const focus = focusIds();
  const el = h('figure', { class: 'st-card wide', id: 'cardSingers' }, h('div', { class: 'st-head' }, h('div', {}, h('h2', { text: 'Tous les chanteurs' }),
    h('p', { text: 'Touchez un en-tête pour trier. « Présence » : départ signalé, sinon dernier signe d’activité + 30 min.' }))));
  el.appendChild(h('div', { class: 'st-table-wrap' }, dataTable(cols, rows.map(r => ({ id: r.id, cells: [nameOf(r.id), tableName(r.tableId),
    dur(r.presenceSec), r.turns, r.guestTurns, fmtNum(r.turnsPerHour, 2), fmtNum(r.expectedTurns, 1), dur(r.waits.avgSec), dur(r.waits.maxSec),
    dur(r.firstTurnSec), r.deferrals, r.presenceSkips, r.removed, r.battleVotes] })),
  { focusOf: row => focus?.has(row.id), sortable: key => {
    state.sort = { key, dir: state.sort.key === key ? -state.sort.dir : (['name', 'table'].includes(key) ? 1 : -1) };
    renderAll();
  } })));
  $('charts').appendChild(el);
}

function renderDefinitions() {
  const box = clear($('definitions'));
  const labels = { presence: 'Présence', turns: 'Passages', wait: 'Attente', requestDelay: 'Délai depuis la demande', fairShare: 'Part attendue',
    jain: 'Équité (indice de Jain)', jainAdjusted: 'Équité corrigée des bonus', demandJain: 'Équité selon les demandes', deadTime: 'Temps mort',
    songsPerHour: 'Chansons par heure', firstTurn: 'Premier passage', guestTurns: 'Invité', turnsPerHour: 'Par heure' };
  for (const [key, text] of Object.entries(state.data.stats.definitions || {})) {
    box.appendChild(h('dt', { text: labels[key] || key }));
    box.appendChild(h('dd', { text }));
  }
}

function renderFilters() {
  const select = clear($('focusSelect'));
  select.appendChild(h('option', { value: '', text: 'Toute la salle' }));
  const st = state.data.stats;
  const tables = st.tables.filter(tb => tb.people);
  if (tables.length) select.appendChild(h('optgroup', { label: 'Tables' }, tables.map(tb => h('option', { value: `t:${tb.id}`, text: tableName(tb.id) }))));
  const people = [...st.singers].sort((a, b) => nameOf(a.id).localeCompare(nameOf(b.id), 'fr'));
  if (people.length) select.appendChild(h('optgroup', { label: 'Chanteurs' }, people.map(x => h('option', { value: `p:${x.id}`, text: `${nameOf(x.id)} · ${tableName(x.tableId)}` }))));
  const values = ['', ...tables.map(tb => `t:${tb.id}`), ...people.map(x => `p:${x.id}`)];
  if (!values.includes(state.focus)) state.focus = '';
  select.value = state.focus;
}

function renderAll() {
  if (!state.data) return;
  // Les graphiques sont redessinés : une info-bulle de l'ancien rendu ne reste pas seule.
  hideTip();
  renderHeader();
  renderInsights();
  renderKpis();
  renderFocus();
  renderCharts();
  renderDefinitions();
}

// ------------------------------------------------------------------ données
const api = (path, params = {}) => `${path}?${new URLSearchParams({ key: KEY, ...params })}`;
async function loadEvenings() {
  try {
    const r = await fetch(api('/api/staff/stats/evenings'));
    if (!r.ok) throw new Error((await r.json()).error || `HTTP ${r.status}`);
    const { evenings } = await r.json();
    const select = clear($('eveningSelect'));
    for (const ev of evenings) {
      select.appendChild(h('option', { value: ev.current ? 'current' : ev.id,
        text: `${ev.current ? 'Ce soir · ' : ''}${new Date(ev.startedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })} ${hhmm(ev.startedAt)}${ev.people ? ` · ${ev.people} inscrits` : ''}` }));
    }
    select.value = state.evening;
    state.listError = null;
  } catch (error) { state.listError = `Liste des soirées indisponible : ${error.message}`; }
  renderErrors();
}

async function load() {
  $('main').className = 'st-main loading';
  try {
    const r = await fetch(api('/api/staff/stats', { evening: state.evening }));
    const body = await r.json();
    if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
    state.data = body;
    state.loadError = null;
    renderFilters();
    renderAll();
  } catch (error) {
    state.loadError = `Statistiques indisponibles : ${error.message}`;
    renderErrors();
  } finally {
    $('main').className = 'st-main';
  }
  schedule();
}

// Soirée en cours : rafraîchie toutes les 15 s, sans clignotement.
function schedule() {
  clearTimeout(state.timer);
  if (state.data?.evening.current) state.timer = setTimeout(load, REFRESH_MS);
}

function applyTheme(value) {
  if (value) document.documentElement.setAttribute('data-theme', value);
  else document.documentElement.removeAttribute('data-theme');
  try { if (value) localStorage.setItem('statsTheme', value); else localStorage.removeItem('statsTheme'); } catch (_) { /* stockage indisponible */ }
}

$('backLink').setAttribute('href', `/staff?key=${encodeURIComponent(KEY)}`);
$('eveningSelect').addEventListener('change', event => { state.evening = event.target.value; state.focus = ''; load(); });
$('focusSelect').addEventListener('change', event => { state.focus = event.target.value; renderAll(); });
$('downloadBtn').addEventListener('click', () => {
  location.assign(api('/api/staff/stats/export', { evening: state.evening, names: $('exportNames').checked ? '1' : '0' }));
});
$('themeSelect').addEventListener('change', event => applyTheme(event.target.value));
try { const saved = localStorage.getItem('statsTheme'); if (saved) { $('themeSelect').value = saved; applyTheme(saved); } } catch (_) { /* stockage indisponible */ }
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderAll, 200); });
loadEvenings();
load();
</script>
</body>
