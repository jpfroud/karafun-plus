# Exceptions de zizmor (job « zizmor (workflows) » du workflow « Sécurité »),
# chacune justifiée. Toute autre alerte fait échouer le contrôle.
rules:
  dangerous-triggers:
    ignore:
      # pull_request_target sans extraction ni exécution du code de la PR :
      # métadonnées de Dependabot lues par l'API et commandes gh fixes.
      - dependabot-auto-merge.yml
  artipacked:
    ignore:
      # Job publier : l'identifiant git sert à créer et envoyer le tag d'une
      # publication manuelle ; aucun code tiers ne s'exécute après l'extraction.
      - release.yml
