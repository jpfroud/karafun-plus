# Exceptions de zizmor (job « zizmor (workflows) » du workflow « Sécurité »),
# chacune justifiée. Toute autre alerte fait échouer le contrôle.
rules:
  dangerous-triggers:
    ignore:
      # pull_request_target : le workflow exécuté est toujours celui de main
      # (un commit poussé sur la branche ne peut pas changer ses règles), sans
      # extraction ni exécution du code de la PR : métadonnées lues par l'API et
      # commandes gh fixes.
      - dependabot-auto-merge.yml
  adhoc-packages:
    ignore:
      # Seule installation hors fichier de verrouillage : Playwright, à version
      # exacte, pour les mesures en navigateur des tests (il n'est pas une
      # dépendance du projet). Le test W10 de test/workflows.test.js refuse
      # toute autre installation de ce genre.
      - ci.yml
      - release.yml
