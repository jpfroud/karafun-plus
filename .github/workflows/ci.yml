name: Tests Windows

on:
  push:
    branches: [main]
  pull_request:
  # Version de test d'une branche : Actions → Tests Windows → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: solver/pom.xml
      - run: npm ci
      - name: Construire Timefold et les notices des dependances
        run: mvn -B -ntp -f solver/pom.xml verify org.codehaus.mojo:license-maven-plugin:2.7.1:add-third-party org.codehaus.mojo:license-maven-plugin:2.7.1:download-licenses
      # Même suite que node test/run-offline.js, avec la mesure de couverture
      # des lignes : la CI échoue si un test échoue ou si la couverture baisse
      # sous le seuil.
      - name: Tests automatiques hors ligne et couverture
        run: node test/coverage.js --min-lines 95
      - name: Garder le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Tester le hook gstack
        shell: pwsh
        run: .\test\gstack-hook.test.ps1
      - name: Tester les hooks gstack de Claude Code
        shell: bash
        run: |
          bash test/gstack-session-hook.test.sh
          node test/gstack-gate.test.js
      - name: Preparer et verifier le kit Windows
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path node | Out-Null
          $nodeSource = (Get-Command node).Source
          Copy-Item -LiteralPath $nodeSource -Destination node\node.exe -Force
          Copy-Item -LiteralPath (Join-Path (Split-Path -Parent $nodeSource) 'LICENSE') -Destination node\LICENSE -Force
          .\PREPARER-KIT-BAR.ps1
          .\test\verify-portable-kit.ps1
      # Kit de test téléchargeable depuis la page de l'exécution (Artifacts).
      # Ce n'est pas une publication : les releases partent seulement de main.
      - name: Garder le kit de test
        uses: actions/upload-artifact@v4
        with:
          name: kit-bar-test-${{ github.sha }}
          path: KIT-BAR-KARAFUN.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: solver/pom.xml
      - run: npm ci
      - name: Construire Timefold et les notices des dependances
        run: mvn -B -ntp -f solver/pom.xml verify org.codehaus.mojo:license-maven-plugin:2.7.1:add-third-party org.codehaus.mojo:license-maven-plugin:2.7.1:download-licenses
      # Playwright n'est pas une dépendance du projet : installation globale
      # (second chemin de test/playwright-browser.js), version épinglée.
      - name: Installer Playwright et Chromium
        run: |
          npm install --global playwright@1.56.1
          playwright install --with-deps chromium
      - name: Verifier que les mesures en navigateur tourneront
        run: |
          node -e "if (!require('./test/playwright-browser').loadPlaywright()) { console.error('Playwright ou Chromium introuvable : les mesures en navigateur seraient ignorées.'); process.exit(1); }"
      - name: Tests automatiques hors ligne et couverture (TZ=UTC)
        env:
          TZ: UTC
        run: node test/coverage.js --min-lines 95
      - name: Garder le rapport de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couverture-linux-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Tester les hooks gstack de Claude Code
        run: |
          bash test/gstack-session-hook.test.sh
          node test/gstack-gate.test.js
      - name: Verifier les workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
