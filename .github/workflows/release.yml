name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version à publier, par exemple v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  IMAGE: ghcr.io/jpfroud/karafun-plus

jobs:
  tests:
    # Version fixe, comme le job linux de ci.yml : Playwright 1.56.1 n'a pas de
    # Chromium pour une Ubuntu plus récente que 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # Refus avant tout autre travail : ni tag, ni kit, ni image.
      - name: Verifier la source et la version de la publication
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo 'Une publication manuelle doit partir de main.' >&2
              exit 1
            fi
            if ! [[ $RELEASE_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo 'La version doit ressembler à v0.1.0.' >&2
              exit 1
            fi
          fi
          # Étiquette Docker : 128 caractères au plus, sans « + » (v1.0.0+build refusé).
          if ! [[ $RELEASE_VERSION =~ ^v[0-9A-Za-z_.-]{0,127}$ ]]; then
            echo "Le tag « $RELEASE_VERSION » ne peut pas servir d'étiquette d'image Docker : lettres, chiffres, « . », « _ » et « - » seulement." >&2
            exit 1
          fi
      # Étapes du job linux de ci.yml ; suite hors ligne sans mesure de couverture.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verifier les workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: solver/pom.xml
      - run: npm ci
      - name: Construire Timefold et les notices des dependances
        run: mvn -B -ntp -f solver/pom.xml verify org.codehaus.mojo:license-maven-plugin:2.7.1:add-third-party org.codehaus.mojo:license-maven-plugin:2.7.1:download-licenses
      - name: Installer Playwright et Chromium
        run: |
          npm install --global playwright@1.56.1
          playwright install --with-deps chromium
      - name: Verifier que les mesures en navigateur tourneront
        run: |
          node -e "if (!require('./test/playwright-browser').loadPlaywright()) { console.error('Playwright ou Chromium introuvable : les mesures en navigateur seraient ignorées.'); process.exit(1); }"
      - name: Tests automatiques hors ligne (TZ=UTC)
        env:
          TZ: UTC
        run: node test/run-offline.js
      - name: Tester les hooks gstack de Claude Code
        run: |
          bash test/gstack-session-hook.test.sh
          node test/gstack-gate.test.js

  kit-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: solver/pom.xml
      - run: npm ci
      - name: Construire Timefold et les notices des dependances
        run: mvn -B -ntp -f solver/pom.xml verify org.codehaus.mojo:license-maven-plugin:2.7.1:add-third-party org.codehaus.mojo:license-maven-plugin:2.7.1:download-licenses
      - name: Tests automatiques hors ligne
        run: node test/run-offline.js
      - name: Tester le hook gstack
        shell: pwsh
        run: .\test\gstack-hook.test.ps1
      - name: Tester les hooks gstack de Claude Code
        shell: bash
        run: bash test/gstack-session-hook.test.sh
      - name: Ajouter Node.js portable au kit
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path node | Out-Null
          $nodeSource = (Get-Command node).Source
          Copy-Item -LiteralPath $nodeSource -Destination node\node.exe -Force
          Copy-Item -LiteralPath (Join-Path (Split-Path -Parent $nodeSource) 'LICENSE') -Destination node\LICENSE -Force
      - name: Construire le kit et vérifier son lancement
        shell: powershell
        env:
          KIT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          .\PREPARER-KIT-BAR.ps1
          .\test\verify-portable-kit.ps1
      - name: Empreinte SHA-256
        shell: powershell
        run: |
          $hash = (Get-FileHash -LiteralPath KIT-BAR-KARAFUN.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KIT-BAR-KARAFUN.zip" | Set-Content -LiteralPath KIT-BAR-KARAFUN.zip.sha256 -Encoding Ascii
      - name: Garder le kit pour la publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kit-windows-${{ github.sha }}
          path: |
            KIT-BAR-KARAFUN.zip
            KIT-BAR-KARAFUN.zip.sha256
          if-no-files-found: error
          retention-days: 1
          overwrite: true
          # ZIP déjà compressé : ne pas le recompresser.
          compression-level: 0

  image:
    needs: tests
    # Runners natifs, sans QEMU : émulé, le rejeu toucherait le plafond de 30 s par décision.
    strategy:
      matrix:
        include:
          - plateforme: linux/amd64
            runner: ubuntu-24.04
            suffixe: amd64
          - plateforme: linux/arm64
            runner: ubuntu-24.04-arm
            suffixe: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Date de construction
        id: date
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # Poussée par empreinte seulement : les étiquettes sont posées par publier.
      - name: Construire et pousser l'image ${{ matrix.plateforme }}
        id: construire
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.plateforme }}
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ env.RELEASE_VERSION }}
            COMMIT=${{ github.sha }}
            BUILT_AT=${{ steps.date.outputs.built_at }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=image-linux-${{ matrix.suffixe }}
          cache-to: type=gha,scope=image-linux-${{ matrix.suffixe }},mode=max
      # Image vérifiée = image publiée : celle du registre, tirée par son empreinte.
      - name: Recuperer l'image poussee
        shell: bash
        env:
          EMPREINTE: ${{ steps.construire.outputs.digest }}
          ATTENDU: ${{ matrix.plateforme }}
        run: |
          docker pull "$IMAGE@$EMPREINTE"
          docker tag "$IMAGE@$EMPREINTE" karafun-plus:verif
          TROUVE=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' karafun-plus:verif)
          if [ "$TROUVE" != "$ATTENDU" ]; then
            echo "L'image construite est $TROUVE, $ATTENDU attendu." >&2
            exit 1
          fi
      - name: Verifier l'image
        run: bash test/verifier-image.sh karafun-plus:verif
      - name: Verifier le deploiement
        if: matrix.suffixe == 'amd64'
        run: bash test/verifier-deploiement.sh karafun-plus:verif
      - name: Noter l'empreinte
        shell: bash
        env:
          EMPREINTE: ${{ steps.construire.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/empreintes"
          touch "$RUNNER_TEMP/empreintes/${EMPREINTE#sha256:}"
      - name: Garder l'empreinte pour la publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-linux-${{ matrix.suffixe }}
          path: ${{ runner.temp }}/empreintes/*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publier:
    needs: [kit-windows, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Une publication à la fois, toutes versions confondues : latest est lu puis
    # posé sans course. Un troisième publier en attente annule le précédent : le relancer.
    concurrency:
      group: release-publier
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      # Identifiants gardés pour l'étape du tag (création et envoi du tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Recuperer le kit Windows
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-windows-${{ github.sha }}
          path: .
      - name: Recuperer les empreintes de l'image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-linux-*
          merge-multiple: true
          path: ${{ runner.temp }}/empreintes
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Creer le tag apres validation, si publication manuelle
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            if ($env:INPUT_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
              throw 'La version doit ressembler à v0.1.0.'
            }
            $existing = git ls-remote --tags origin "refs/tags/$env:INPUT_VERSION"
            if ($LASTEXITCODE -ne 0) { throw 'Impossible de verifier les tags distants.' }
            if ($existing) {
              $peeled = git ls-remote --tags origin "refs/tags/$env:INPUT_VERSION^{}"
              if ($LASTEXITCODE -ne 0) { throw 'Impossible de verifier le commit du tag.' }
              $commit = if ($peeled) { ($peeled -split '\s+')[0] } else { ($existing -split '\s+')[0] }
              if ($commit -ne $env:GITHUB_SHA) {
                throw 'Cette version désigne déjà un autre commit.'
              }
            } else {
              git tag $env:INPUT_VERSION $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Creation du tag impossible.' }
              git push origin "refs/tags/$env:INPUT_VERSION"
              if ($LASTEXITCODE -ne 0) { throw 'Publication du tag impossible.' }
            }
            $tag = $env:INPUT_VERSION
          } else {
            $tag = $env:GITHUB_REF_NAME
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Publier l'image multi-architecture
        id: publier-image
        shell: bash
        run: |
          shopt -s nullglob
          EMPREINTES=("$RUNNER_TEMP"/empreintes/*)
          if [ "${#EMPREINTES[@]}" -ne 2 ]; then
            echo "Il faut exactement deux empreintes d'image (amd64 et arm64), trouvé ${#EMPREINTES[@]}." >&2
            exit 1
          fi
          SOURCES=()
          for fichier in "${EMPREINTES[@]}"; do
            if ! [[ ${fichier##*/} =~ ^[0-9a-f]{64}$ ]]; then
              echo "Empreinte d'image illisible : ${fichier##*/}." >&2
              exit 1
            fi
            SOURCES+=("$IMAGE@sha256:${fichier##*/}")
          done
          # lire_index <image:étiquette> : index publié dans INDEX (stdout seul) ;
          # code 1 si l'étiquette n'existe pas encore, arrêt sur toute autre erreur.
          lire_index() {
            if INDEX=$(docker buildx imagetools inspect --raw "$1" 2> "$RUNNER_TEMP/inspect.err"); then
              return 0
            fi
            if grep -qiE 'not found|manifest unknown' "$RUNNER_TEMP/inspect.err"; then
              return 1
            fi
            echo "Lecture de ${1##*:} impossible : $(sed -n 1p "$RUNNER_TEMP/inspect.err")" >&2
            exit 1
          }
          # Étiquette déjà publiée pour un autre commit (tag déplacé ou recréé) : jamais remplacée.
          if lire_index "$IMAGE:$RELEASE_TAG"; then
            REVISION=$(jq -r '.annotations["org.opencontainers.image.revision"] // ""' <<< "$INDEX")
            if [ "$REVISION" != "$GITHUB_SHA" ]; then
              echo "Cette version désigne déjà un autre commit (image $RELEASE_TAG : ${REVISION:-sans révision})." >&2
              exit 1
            fi
          fi
          ETIQUETTES=(-t "$IMAGE:$RELEASE_TAG")
          LATEST=0
          # latest : la plus haute version sans suffixe, jamais en recul.
          if [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            ACTUELLE=''
            if lire_index "$IMAGE:latest"; then
              ACTUELLE=$(jq -r '.annotations["org.opencontainers.image.version"] // ""' <<< "$INDEX")
            fi
            PREMIERE=$(printf '%s\n' "$RELEASE_TAG" "$ACTUELLE" | sort -V | sed -n 1p)
            if [ -n "$ACTUELLE" ] && [ "$ACTUELLE" != "$RELEASE_TAG" ] && [ "$PREMIERE" = "$RELEASE_TAG" ]; then
              echo "::warning::latest reste sur $ACTUELLE, plus récente que $RELEASE_TAG."
            else
              ETIQUETTES+=(-t "$IMAGE:latest")
              LATEST=1
            fi
          fi
          ANNOTATIONS=(
            --annotation "index:org.opencontainers.image.source=https://github.com/jpfroud/karafun-plus"
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA"
            --annotation "index:org.opencontainers.image.version=$RELEASE_TAG"
          )
          verifier_plateformes() {
            PLATEFORMES=$(jq -r '[.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | sort | join(", ")' <<< "$1")
            if [ "$PLATEFORMES" != 'linux/amd64, linux/arm64' ]; then
              echo "L'image publiée doit contenir exactement linux/amd64 et linux/arm64 (trouvé : $PLATEFORMES)." >&2
              exit 1
            fi
          }
          # Index vérifié avant d'être poussé (--dry-run), puis relu dans le registre.
          PREVU=$(docker buildx imagetools create --dry-run "${ETIQUETTES[@]}" "${ANNOTATIONS[@]}" "${SOURCES[@]}")
          verifier_plateformes "$PREVU"
          docker buildx imagetools create "${ETIQUETTES[@]}" "${ANNOTATIONS[@]}" "${SOURCES[@]}"
          MANIFESTE=$(docker buildx imagetools inspect --raw "$IMAGE:$RELEASE_TAG")
          verifier_plateformes "$MANIFESTE"
          EMPREINTE=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:$RELEASE_TAG" | jq -r '.digest')
          if ! [[ $EMPREINTE =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Empreinte de l'image publiée illisible : $EMPREINTE." >&2
            exit 1
          fi
          if [ "$LATEST" = 1 ]; then
            EMPREINTE_LATEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE:latest" | jq -r '.digest')
            if [ "$EMPREINTE_LATEST" != "$EMPREINTE" ]; then
              echo "latest ne désigne pas l'image de cette version." >&2
              exit 1
            fi
          fi
          echo "Image publiée : $IMAGE:$RELEASE_TAG ($PLATEFORMES), $IMAGE@$EMPREINTE"
          echo "empreinte=$EMPREINTE" >> "$GITHUB_OUTPUT"
      - name: Publier la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "$env:RELEASE_TAG" --json tagName --jq '.tagName' 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:RELEASE_TAG" KIT-BAR-KARAFUN.zip KIT-BAR-KARAFUN.zip.sha256 --title "$env:RELEASE_TAG" --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { throw 'Création de la release impossible.' }
          } else {
            gh release upload "$env:RELEASE_TAG" KIT-BAR-KARAFUN.zip KIT-BAR-KARAFUN.zip.sha256 --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Mise à jour des fichiers de release impossible.' }
            Write-Host 'Release existante actualisée pour le même commit.'
          }
      - name: Ajouter l'image aux notes de la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EMPREINTE: ${{ steps.publier-image.outputs.empreinte }}
        run: |
          BLOC=$(cat <<'MARKDOWN'
          <!-- image-docker -->
          **Image Docker**

          - Version : `ghcr.io/jpfroud/karafun-plus:@VERSION@` (linux/amd64, linux/arm64)
          - Empreinte : `ghcr.io/jpfroud/karafun-plus@sha256:@EMPREINTE@`
          - Mise à jour du serveur : voir `DEPLOIEMENT-SERVEUR.md` (variable `KARAFUN_PLUS_VERSION` de `deploy/.env`).
          <!-- /image-docker -->
          MARKDOWN
          )
          BLOC=${BLOC//@VERSION@/$RELEASE_TAG}
          BLOC=${BLOC//@EMPREINTE@/${EMPREINTE#sha256:}}
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/notes-avant.md"
          # Anciens blocs de l'image retirés (relance), nouveau bloc en tête.
          perl -0pe 's/<!-- image-docker -->.*?<!-- \/image-docker -->\s*//gs; s/\A\s+//' "$RUNNER_TEMP/notes-avant.md" > "$RUNNER_TEMP/notes-reste.md"
          { printf '%s\n\n' "$BLOC"; cat "$RUNNER_TEMP/notes-reste.md"; } > "$RUNNER_TEMP/notes.md"
          if [ "$(grep -c -x -F '<!-- image-docker -->' "$RUNNER_TEMP/notes.md")" -gt 1 ]; then
            echo "Mise à jour des notes de release impossible : bloc de l'image en double." >&2
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md"
