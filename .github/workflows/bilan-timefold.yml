name: Bilan Timefold

# Bilan avant/après exigé par AGENTS.md pour tout changement de la rotation :
# la soirée de référence anonymisée est rejouée avec Timefold par la version
# de base de la PR, puis par la PR, et les deux sont mesurées par
# evening-stats.js. Le tableau (attentes, équilibre des passages, anomalies,
# personnes qui y perdent ou y gagnent) est dans le résumé de l'exécution.
# Lancé aussi sur les PR de Dependabot qui changent Timefold : elles ne sont
# jamais fusionnées automatiquement. Le bilan informe, il ne bloque pas :
# un déséquilibre des passages ne se fusionne pas sans accord explicite.
on:
  pull_request:
    paths:
      - 'solver/**'
      - 'scheduler.js'
      - 'lib/scheduler/**'
      - 'evening-stats.js'
      - 'test/rejeu-soiree.js'
  workflow_dispatch:
    inputs:
      avant:
        description: Révision de comparaison (commit, tag ou branche distante comme origin/main)
        required: true
        default: origin/main

permissions:
  contents: read

concurrency:
  group: bilan-timefold-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bilan:
    name: Rejeu avant/après de la soirée de référence
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      # Historique complet : le rejeu extrait la révision de base avec git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - name: Construire Timefold (version de la PR)
        run: mvn -B -ntp -f solver/pom.xml verify
      # shell: bash ajoute pipefail : un rejeu qui échoue fait échouer l'étape
      # malgré « | tee ».
      - name: Rejouer la soirée de référence
        shell: bash
        env:
          AVANT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.avant }}
        run: |
          git rev-parse --verify --quiet "$AVANT^{commit}" > /dev/null || { echo "Révision inconnue : $AVANT" >&2; exit 1; }
          node test/rejeu-soiree.js test/fixtures/soiree-2026-10-15-anonyme.json --avant "$AVANT" --solveur --cles | tee bilan.txt
          {
            echo "### Bilan avant/après (Timefold, soirée de référence anonymisée)"
            echo
            echo '```'
            sed -n '/^BILAN AVANT/,$p' bilan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bilan-timefold-${{ github.sha }}
          path: bilan.txt
          retention-days: 30
