name: Sécurité

# Veille de sécurité du dépôt, de l'image et des workflows, sur chaque PR, sur
# main et chaque lundi (une alerte nouvelle sur une version déjà publiée fait
# échouer l'exécution du lundi : GitHub prévient alors le mainteneur par
# e-mail). Résultats détaillés dans Security → Code scanning. Règles et
# exceptions : SECURITY.md.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Une analyse planifiée a son propre groupe : un envoi sur main ne l'annule pas.
concurrency:
  group: securite-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.1

jobs:
  dependances:
    name: Revue des dépendances ajoutées
    # Refuse une PR qui ajoute ou met à jour une dépendance vulnérable
    # (gravité moyenne ou plus), quelle que soit sa source.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: true
          warn-on-openssf-scorecard-level: 3

  npm-audit:
    name: Audit npm (production)
    # Lit package-lock.json seulement : aucune installation, aucun script.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Alertes faibles ou modérées connues de la famille Socket.IO 2.x :
      # SECURITY.md. Une alerte élevée ou critique fait échouer ce contrôle.
      - name: npm audit --omit=dev --audit-level=high
        run: npm audit --omit=dev --audit-level=high

  trivy-depot:
    name: Trivy (dépendances, secrets, Dockerfile)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rapport complet (onglet Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-depot.sarif
      - name: Publier le rapport
        # Une PR venue d'un fork n'a pas le droit d'écrire dans l'onglet Security.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-depot.sarif
          category: trivy-depot
      - name: Refuser une faille élevée ou critique corrigeable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  trivy-image:
    name: Trivy (image construite)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Construire l'image amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: karafun-plus:securite
          provenance: false
          sbom: false
          cache-from: type=gha,scope=image-linux-amd64
      - name: Rapport complet (onglet Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: karafun-plus:securite
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
      - name: Publier le rapport
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      # Debian publie parfois une faille sans correctif : seules les failles
      # corrigeables bloquent ; les autres restent visibles dans le rapport.
      - name: Refuser une faille élevée ou critique corrigeable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: karafun-plus:securite
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  image-publiee:
    name: Trivy (image publiée latest)
    # Une image déjà installée sur un VPS devient vulnérable avec le temps :
    # un échec ici demande une nouvelle release (RELEASE.md).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Rapport complet (onglet Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ghcr.io/jpfroud/karafun-plus:latest
          scanners: vuln
          format: sarif
          output: image-publiee.sarif
      - name: Publier le rapport
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: image-publiee.sarif
          category: image-publiee
      - name: Signaler une faille élevée ou critique corrigeable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ghcr.io/jpfroud/karafun-plus:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  workflows:
    name: zizmor (workflows)
    # Injections, droits trop larges, actions non épinglées, caches ou
    # déclencheurs dangereux dans .github/workflows.
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Version fixée, comme TRIVY_VERSION : une nouvelle règle de zizmor ne
          # bloque pas d'un coup toutes les PR ; la relever exprès.
          version: 1.32.0
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml

  # Contrôle unique à exiger sur main avec « Tests OK » : la fusion
  # automatique de Dependabot n'attend que les contrôles exigés. Il échoue si
  # une analyse de la PR n'a pas réussi (échec, annulation ou saut).
  securite-ok:
    name: Sécurité OK
    if: always() && github.event_name == 'pull_request'
    needs: [dependances, npm-audit, trivy-depot, trivy-image, workflows]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Toutes les analyses ont réussi
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTATS"
          for resultat in $RESULTATS; do
            [ "$resultat" = success ] || { echo "::error::Une analyse de sécurité n'a pas réussi ($resultat)."; exit 1; }
          done
