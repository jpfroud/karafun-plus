# karafun-plus sur un VPS : Caddy (HTTPS, Let's Encrypt) devant l'application.
# Depuis ce dossier : cp .env.example .env && chmod 600 .env, remplir .env, puis
#   docker compose up -d
# Lien de la page du bar : docker compose exec app node server.js --print-staff-url
# Nouvelle clé du bar : docker compose exec app node server.js --rotate-staff-key
#   puis docker compose restart app
# Diagnostic KaraFun : docker run --rm ghcr.io/jpfroud/karafun-plus:<version> node tools/diag-karafun.js <code>
# Arrêt (la soirée est enregistrée) : docker compose stop app
# Jamais « docker compose run app » sans commande : ce serait un second serveur.
name: karafun-plus

x-journaux: &journaux
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-durci: &durci
  # Aucune capacité Linux ni élévation de privilèges (setuid) dans les conteneurs.
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  caddy:
    # Version et empreinte fixées : chaque correctif de Caddy, seule entrée
    # exposée à Internet, arrive par Dependabot puis par une release ; la mise
    # à jour du serveur télécharge alors cette image.
    image: caddy:2.11.8@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    restart: unless-stopped
    <<: *durci
    # Capacités gardées : écouter sur les ports 80 et 443, et lire le Caddyfile
    # monté depuis l'hôte quels que soient ses droits (Caddy tourne en root ; un
    # git checkout de l'agent de mise à jour l'écrit en 0660). DAC_OVERRIDE fait
    # partie des droits par défaut de Docker ; jamais DAC_READ_SEARCH, qui
    # permet open_by_handle_at et la sortie du conteneur.
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?à renseigner dans deploy/.env}
      HOTE_CLIENTS: ${HOTE_CLIENTS:?à renseigner dans deploy/.env}
      HOTE_BAR: ${HOTE_BAR:?à renseigner dans deploy/.env}
      BAR_USER: ${BAR_USER:?à renseigner dans deploy/.env}
      BAR_PASSWORD_HASH: ${BAR_PASSWORD_HASH:?à renseigner dans deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *journaux

  app:
    image: ghcr.io/jpfroud/karafun-plus:${KARAFUN_PLUS_VERSION:?à renseigner dans deploy/.env}
    restart: unless-stopped
    <<: *durci
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:3000:3000" # tunnel SSH seulement ; Docker contourne ufw
    environment:
      KARAOKE_PUBLIC_URL: ${KARAOKE_PUBLIC_URL:?à renseigner dans deploy/.env}
      KARAOKE_STAFF_URL: ${KARAOKE_STAFF_URL:?à renseigner dans deploy/.env}
      KARAOKE_UPDATE_DIR: ${KARAOKE_UPDATE_DIR:-}
    volumes:
      - karafun-data:/app/data
      - karafun-journal:/app/journal
      - ./maintenance:/app/maintenance
    logging: *journaux

volumes:
  karafun-data:
  karafun-journal:
  caddy_data:
  caddy_config:
